<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca Escolar</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <aside>
        <h1>Biblioteca</h1>

        <nav>
            <a href="#" id="menu-acervo">Acervo</a>
            <a href="#" id="menu-reservas">Minhas Reservas</a>
            <a href="#" id="menu-emprestimos">Meus Empréstimos</a>
            <a href="#" id="menu-multas">Minhas Multas</a>
            <a href="#" id="menu-estudantes">Localizar Estudante</a>
            <a href="#" id="menu-registrar-emprestimo">Registrar Empréstimo</a>
            <a href="#" id="menu-registrar-devolucao">Registrar Devolução</a>
        </nav>
    </aside>

    <main>

        <header>
            <h2 id="titulo-pagina">Acervo</h2>
            <p id="descricao-pagina">
                Encontre os livros disponíveis na biblioteca.
            </p>
        </header>

        <section id="area-pesquisa">
            <input
                type="text"
                id="pesquisa-livro"
                placeholder="Pesquisar livro..."
            >
        </section>

        <section id="lista-livros">
        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
